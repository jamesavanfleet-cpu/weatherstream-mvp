name: Morning Briefing Refresh

# Runs once daily at 4:00 AM Eastern time year-round.

# EDT (Mar-Nov): 08:00 UTC

# EST (Nov-Mar): 09:00 UTC

# Both seasonal triggers are retained so the heavy refresh runs at 4:00 AM local time, while the inactive seasonal trigger exits without generating or publishing.

on:
  schedule:
    - cron: '0 8 * * *'     # 4:00 AM EDT
    - cron: '0 9 * * *'     # 4:00 AM EST
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run regardless of time window (for testing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'


permissions:
  contents: write


jobs:
  forecast-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check if this is the correct Eastern-time run
        id: dst_check
        run: |
          # Allow force override for manual testing
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "cycle=forced" >> "$GITHUB_OUTPUT"
            echo "Force run requested -- proceeding with refresh."
            exit 0
          fi


          EVENT_NAME="${{ github.event_name }}"
          SCHEDULE_EXPR="${{ github.event.schedule }}"
          ET_HOUR=$(TZ=America/New_York date +%-H)
          ET_MINUTE=$(TZ=America/New_York date +%-M)
          ET_DATE=$(TZ=America/New_York date +%F)
          ET_TZ=$(TZ=America/New_York date +%Z)
          UTC_HOUR=$(date -u +%-H)
          UTC_MINUTE=$(date -u +%-M)


          if [ "$ET_TZ" = "EDT" ]; then
            ACTIVE_AM_CRON='0 8 * * *'
            ACTIVE_PM_CRON='45 19 * * *'
          else
            ACTIVE_AM_CRON='0 9 * * *'
            ACTIVE_PM_CRON='45 20 * * *'
          fi


          AM_WINDOW=0
          PM_WINDOW=0
          if [ "$ET_HOUR" -ge 3 ] && [ "$ET_HOUR" -le 5 ]; then
            AM_WINDOW=1
          fi
          if [ "$ET_HOUR" -ge 15 ] && [ "$ET_HOUR" -le 17 ]; then
            PM_WINDOW=1
          fi
